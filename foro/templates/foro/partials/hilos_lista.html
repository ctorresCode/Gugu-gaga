{% for hilo in page_obj %}
    {% if forloop.last and page_obj.has_next %}
        <div hx-get="?page={{ page_obj.next_page_number }}{% if busqueda_actual %}&q={{ busqueda_actual }}{% endif %}{% if uni_actual %}&uni={{ uni_actual }}{% endif %}" 
             hx-trigger="revealed" 
             hx-swap="afterend">
            {% include 'foro/partials/tarjeta_hilo.html' %}
        </div>
    {% else %}
        {% include 'foro/partials/tarjeta_hilo.html' %}
    {% endif %}
{% endfor %}
