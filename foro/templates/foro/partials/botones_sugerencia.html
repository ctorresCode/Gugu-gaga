{# Like/dislike de una sugerencia. Requiere la sugerencia anotada con Sugerencia.objects.con_conteos(). #}
<form method="post" action="{% url 'interaccion_sugerencia' sugerencia.public_id 'like' %}" onclick="event.stopPropagation();" class="inline">
    {% csrf_token %}
    <button type="submit" class="flex items-center gap-1.5 text-sm cursor-pointer {% if sugerencia.les_gusta_al_usuario %}text-blue-600 font-bold{% else %}text-gray-500 hover:text-blue-600{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
        <span id="sug-like-count-{{ sugerencia.id }}">{{ sugerencia.conteo_likes|default:"0" }}</span>
    </button>
</form>

<form method="post" action="{% url 'interaccion_sugerencia' sugerencia.public_id 'dislike' %}" onclick="event.stopPropagation();" class="inline">
    {% csrf_token %}
    <button type="submit" class="flex items-center gap-1.5 text-sm cursor-pointer {% if sugerencia.no_les_gusta_al_usuario %}text-red-600 font-bold{% else %}text-gray-500 hover:text-red-600{% endif %}">
        <svg class="w-5 h-5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
        <span id="sug-dislike-count-{{ sugerencia.id }}">{{ sugerencia.conteo_dislikes|default:"0" }}</span>
    </button>
</form>
