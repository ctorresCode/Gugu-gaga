<div onclick="window.location.href='{% url 'detalle_respuesta' hijo.public_id %}'" class="bg-white p-5 rounded-3xl shadow-[0_2px_10px_rgb(0,0,0,0.02)] hover:shadow-md border border-gray-100 transition-all cursor-pointer group mt-4">
    <div class="flex items-start gap-4">
        <div class="flex-shrink-0">
            <a href="{% url 'perfil_usuario' hijo.autor.username %}" onclick="event.stopPropagation();" class="block hover:opacity-80 transition-opacity">
                {% if hijo.autor.avatar %}
                    <img src="{{ hijo.autor.avatar.url }}" class="w-11 h-11 rounded-full object-cover shadow-sm">
                {% else %}
                    <div class="w-11 h-11 rounded-full bg-[#093D77] text-white flex items-center justify-center font-bold uppercase text-sm shadow-sm">
                        {{ hijo.autor.username|make_list|first }}
                    </div>
                {% endif %}
            </a>
        </div>
        
        <div class="flex-grow min-w-0 pt-0.5">
            <div class="flex items-center gap-2 mb-1.5">
                <a href="{% url 'perfil_usuario' hijo.autor.username %}" onclick="event.stopPropagation();" class="font-extrabold text-[#2B2B2B] text-[15px] truncate hover:text-[#093D77] hover:underline decoration-2 underline-offset-2">{{ hijo.autor.username }}</a>
                <span class="text-[#3A7CA5] text-xs font-semibold whitespace-nowrap opacity-80">· {{ hijo.fecha_creacion|timesince }}</span>
            </div>

            <p class="text-[#2B2B2B] text-[15px] md:text-base leading-relaxed font-medium mb-3 opacity-90 break-words">{{ hijo.contenido }}</p>

            <div class="flex items-center gap-8 text-[#3A7CA5] font-semibold mt-1">
                <div class="flex items-center gap-1.5 group/reply hover:text-[#093D77] transition-colors">
                    <div class="p-2 -ml-2 rounded-full group-hover/reply:bg-[#093D77]/10 transition-colors">
                        <svg viewBox="0 0 24 24" class="w-[22px] h-[22px] fill-current"><g><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></g></svg>
                    </div>
                    <span id="contador-hijas-{{ hijo.id }}" class="text-xs">{{ hijo.respuestas_hijas.count }}</span>
                </div>
                
                {% include 'foro/partials/boton_like_respuesta.html' with respuesta=hijo %}
            </div>
        </div>
    </div>
</div>
