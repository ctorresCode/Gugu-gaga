<div data-url="{% url 'detalle_sugerencia' sugerencia.public_id %}" onclick="window.location=this.getAttribute('data-url')" class="bg-white rounded-2xl border border-gray-100 p-5 hover:bg-gray-50 transition-colors shadow-sm cursor-pointer">
    <div class="flex justify-between items-start mb-2">
        <div class="flex items-center gap-2">
            <div class="font-bold text-gray-900">
                {% if sugerencia.usuario %}
                    {{ sugerencia.usuario.username }}
                {% else %}
                    Anónimo
                {% endif %}
            </div>
            <span class="text-gray-400 text-sm">· hace {{ sugerencia.created_at|timesince }}</span>
        </div>
        <span class="bg-yellow-50 text-yellow-700 border border-yellow-200 text-xs font-semibold px-2 py-1 rounded-md">
            Sugerencia
        </span>
    </div>
    
    <p class="text-gray-800 mt-2 break-words">{{ sugerencia.contenido|linebreaksbr }}</p>

    <div class="flex items-center gap-4 mt-4 pt-3 border-t border-gray-100">
        {% include 'foro/partials/botones_sugerencia.html' %}

        <a href="{% url 'detalle_sugerencia' sugerencia.public_id %}" onclick="event.stopPropagation();" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-[#093D77] ml-auto">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            Responder
        </a>
    </div>
</div>
