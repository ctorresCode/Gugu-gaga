<div data-url="{% url 'detalle_sugerencia' sugerencia.public_id %}" onclick="window.location=this.getAttribute('data-url')" class="bg-white rounded-2xl border border-gray-100 p-5 hover:bg-gray-50 transition-colors shadow-sm cursor-pointer">
    <div class="flex justify-between items-start mb-2">
        <div class="flex items-center gap-2">
            <div class="font-bold text-gray-900">
                {% if sugerencia.usuario %}
                    {{ sugerencia.usuario.username }}
                {% else %}
                    Anónimo
                {% endif %}
            </div>
            <span class="text-gray-400 text-sm">· hace un momento</span>
        </div>
        <span class="bg-yellow-50 text-yellow-700 border border-yellow-200 text-xs font-semibold px-2 py-1 rounded-md">
            Sugerencia
        </span>
    </div>
    
    <p class="text-gray-800 mt-2 break-words">{{ sugerencia.contenido|linebreaksbr }}</p>

    <div class="flex items-center gap-4 mt-4 pt-3 border-t border-gray-100">
        <a href="{% url 'interaccion_sugerencia' sugerencia.public_id 'like' %}" onclick="event.stopPropagation();" class="flex items-center gap-1.5 text-sm {% if request.user in sugerencia.likes.all %}text-blue-600 font-bold{% else %}text-gray-500 hover:text-blue-600{% endif %}">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
            <span id="sug-like-count-{{ sugerencia.id }}">{{ sugerencia.likes.count }}</span>
        </a>

        <a href="{% url 'interaccion_sugerencia' sugerencia.public_id 'dislike' %}" onclick="event.stopPropagation();" class="flex items-center gap-1.5 text-sm {% if request.user in sugerencia.dislikes.all %}text-red-600 font-bold{% else %}text-gray-500 hover:text-red-600{% endif %}">
            <svg class="w-5 h-5 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path></svg>
            <span id="sug-dislike-count-{{ sugerencia.id }}">{{ sugerencia.dislikes.count }}</span>
        </a>

        <a href="{% url 'detalle_sugerencia' sugerencia.public_id %}" onclick="event.stopPropagation();" class="flex items-center gap-1.5 text-sm text-gray-500 hover:text-[#093D77] ml-auto">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
            Responder
        </a>
    </div>
</div>
