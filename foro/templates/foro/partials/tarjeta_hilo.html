<div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:border-gray-200 transition-colors cursor-pointer mb-4">
    <div class="flex items-center gap-2 mb-3">
        <span class="bg-gray-900 text-white text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wide">
            {{ hilo.universidad.nombre|default:"Global" }}
        </span>
        <span class="text-xs text-gray-500 font-semibold">{{ hilo.fecha_creacion|timesince }}</span>
    </div>
    {% if hilo.titulo and hilo.titulo != "Publicación de "|add:hilo.autor.username %}
        <h2 class="text-xl font-bold text-gray-900 mb-2">{{ hilo.titulo }}</h2>
    {% endif %}
    <p class="text-gray-900 text-base leading-relaxed font-normal">{{ hilo.contenido }}</p>
    {% if hilo.imagen %}
        <img src="{{ hilo.imagen.url }}" class="mt-3 rounded-2xl max-h-96 w-full object-cover border border-gray-100">
    {% endif %}
</div>
