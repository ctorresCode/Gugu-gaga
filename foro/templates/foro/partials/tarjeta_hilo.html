<a href="{% url 'detalle_hilo' hilo.pk %}" class="block">
<div class="bg-white p-4 hover:bg-gray-50/50 transition-colors cursor-pointer border-b border-gray-100">
    <div class="flex items-start gap-3">
        <div class="flex-shrink-0">
            <div class="w-10 h-10 rounded-full bg-gray-200 border border-gray-300 flex items-center justify-center font-bold text-gray-700 uppercase select-none text-sm">
                {{ hilo.autor.username|make_list|first|default:"U" }}
            </div>
        </div>
        
        <div class="flex-grow min-w-0">
            <div class="flex items-center justify-between mb-1">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="font-bold text-gray-900 text-sm truncate">{{ hilo.autor.username }}</span>
                    <span class="text-gray-500 text-xs whitespace-nowrap">· {{ hilo.fecha_creacion|timesince }}</span>
                </div>
                <span class="bg-gray-900 text-white text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wide flex-shrink-0 ml-2">
                    {{ hilo.universidad.nombre|default:"Global" }}
                </span>
            </div>

            <p class="text-gray-900 text-sm md:text-base leading-relaxed font-normal mb-3">{{ hilo.contenido }}</p>

            {% if hilo.imagen %}
                <img src="{{ hilo.imagen.url }}" class="mb-3 rounded-2xl max-h-96 w-full object-cover border border-gray-100">
            {% endif %}

            <div class="flex items-center justify-between text-gray-500 max-w-md pr-4 pt-1">
                <div class="flex items-center gap-2 group hover:text-blue-500 transition-colors">
                    <div class="p-2 -ml-2 rounded-full group-hover:bg-blue-50 transition-colors">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="w-5 h-5 fill-current"><g><path d="M1.751 10c0-4.42 3.584-8 8.005-8h4.366c4.49 0 8.129 3.64 8.129 8.13 0 2.96-1.607 5.68-4.196 7.11l-8.054 4.46v-3.69h-.067c-4.49.1-8.183-3.51-8.183-8.01zm8.005-6c-3.317 0-6.005 2.69-6.005 6 0 3.37 2.77 6.08 6.138 6.01l.351-.01h1.761v2.3l5.087-2.81c1.951-1.08 3.163-3.13 3.163-5.36 0-3.39-2.744-6.13-6.129-6.13H9.756z"></path></g></svg>
                    </div>
                    <span class="text-xs font-medium">0</span>
                </div>

                <div class="flex items-center gap-2 group hover:text-red-500 transition-colors">
                    <div class="p-2 rounded-full group-hover:bg-red-50 transition-colors">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="w-5 h-5 fill-current"><g><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.09-.806-1.09C9.984 6.01 8.526 5.44 7.304 5.5c-1.243.07-2.349.78-2.91 1.91-.552 1.12-.633 2.78.479 4.82 1.074 1.97 3.257 4.27 7.129 6.61 3.87-2.34 6.052-4.64 7.126-6.61 1.111-2.04 1.03-3.7.477-4.82-.561-1.13-1.666-1.84-2.908-1.91zm4.187 7.69c-1.351 2.48-4.001 5.12-8.379 7.67l-.503.3-.504-.3c-4.379-2.55-7.029-5.19-8.382-7.67-1.36-2.5-1.41-4.86-.514-6.67.887-1.79 2.647-2.91 4.601-3.01 1.651-.09 3.368.56 4.798 2.01 1.429-1.45 3.146-2.1 4.796-2.01 1.954.1 3.714 1.22 4.601 3.01.896 1.81.846 4.17-.514 6.67z"></path></g></svg>
                    </div>
                    <span class="text-xs font-medium">0</span>
                </div>

                <div class="flex items-center gap-2 group hover:text-blue-500 transition-colors">
                    <div class="p-2 rounded-full group-hover:bg-blue-50 transition-colors">
                        <svg viewBox="0 0 24 24" aria-hidden="true" class="w-5 h-5 fill-current"><g><path d="M12 2.59l5.7 5.7-1.41 1.42L13 6.41V16h-2V6.41l-3.3 3.3-1.41-1.42L12 2.59zM21 15l-.02 3.51c0 1.38-1.12 2.49-2.5 2.49H5.5C4.11 21 3 19.88 3 18.5V15h2v3.5c0 .28.22.5.5.5h12.98c.28 0 .5-.22.5-.5L19 15h2z"></path></g></svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</a>
