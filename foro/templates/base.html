{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="htmx-config" content='{"historyCacheSize": 10}' />
    <title>{% block title %} {% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
      html {
        scrollbar-gutter: stable;
        overflow-y: scroll;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
    </style>
    <link rel="stylesheet" href="/static/css/output.css" hx-preserve="true" />
  </head>
  <body class="bg-[#F8F9FA] text-[#2B2B2B]" hx-boost="true">
    {% block content %} {% endblock %}

    <script>
      function toggleMenuHilo(menuId) {
        document.querySelectorAll('[id^="menu-hilo-"]').forEach((menu) => {
          if (menu.id !== menuId) menu.classList.add("hidden");
        });
        const menu = document.getElementById(menuId);
        if (menu) {
          menu.classList.toggle("hidden");
        }
      }

      document.addEventListener("click", function (event) {
        if (!event.target.closest(".relative-menu")) {
          document.querySelectorAll('[id^="menu-hilo-"]').forEach((menu) => {
            menu.classList.add("hidden");
          });
        }
      });

      function openDeleteModal(hiloId) {
        const menu = document.getElementById("menu-hilo-" + hiloId);
        if (menu) menu.classList.add("hidden");

        const modal = document.getElementById("modal-borrar-" + hiloId);
        if (modal) {
          modal.classList.remove("hidden");
          modal.classList.add("flex");
          setTimeout(() => {
            modal.classList.remove("opacity-0");
            modal.querySelector("div").classList.remove("scale-95");
          }, 10);
          document.body.style.overflow = "hidden";
        }
      }

      function closeDeleteModal(hiloId) {
        const modal = document.getElementById("modal-borrar-" + hiloId);
        if (modal) {
          modal.classList.add("opacity-0");
          modal.querySelector("div").classList.add("scale-95");
          setTimeout(() => {
            modal.classList.add("hidden");
            modal.classList.remove("flex");
            document.body.style.overflow = "";
          }, 300);
        }
      }
    </script>
  </body>
</html>
