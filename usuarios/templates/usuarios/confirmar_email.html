{% extends 'base.html' %}
{% block title %} Confirmar correo {% endblock %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
<div class="min-h-screen flex items-center justify-center relative bg-gray-950 bg-cover bg-center py-10" style="background-image: url('/static/img/LoginImageBackground.png');">
  <div class="absolute inset-0 bg-black/70 z-0"></div>

  <div class="w-full max-w-[92%] sm:max-w-md bg-[#0f172a] p-8 sm:p-10 rounded-2xl shadow-2xl relative z-10 border border-gray-700">

    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold text-white tracking-tight">Confirma tu correo</h2>
      <p class="text-sm text-gray-400 mt-2">Escribe el código de 6 dígitos que enviamos a <span class="text-white font-semibold">{{ email_pendiente }}</span>.</p>
    </div>

    {% for error in form.codigo.errors %}<div class="bg-red-500/10 border border-red-500 text-red-500 p-3 rounded-xl mb-6 text-sm text-center font-bold">{{ error }}</div>{% endfor %}

    <form method="post" hx-boost="false" class="space-y-5">
      {% csrf_token %}
      <div>
        <label for="id_codigo" class="block text-sm font-medium text-gray-200 mb-2">Código de verificación</label>
        <input type="text" name="codigo" id="id_codigo" required minlength="6" maxlength="6" inputmode="numeric" autocomplete="one-time-code" autofocus
               class="w-full px-4 py-3 border-0 ring-1 ring-inset ring-gray-600 rounded-xl focus:ring-2 focus:ring-inset focus:ring-[#3b82f6] outline-none transition-shadow text-white bg-[#1e293b] sm:text-sm shadow-inner tracking-[0.5em] text-center">
      </div>
      <button type="submit" class="w-full bg-[#174b9e] hover:bg-[#113a7a] active:bg-[#0c2a5c] text-white font-bold py-3.5 px-4 rounded-xl transition-colors mt-6 text-sm shadow-lg cursor-pointer">
        Confirmar correo
      </button>
    </form>

    <form method="post" hx-boost="false" class="mt-3">
      {% csrf_token %}
      <input type="hidden" name="accion" value="cancelar">
      <button type="submit" class="w-full text-gray-400 hover:text-white text-sm font-semibold py-2 cursor-pointer">Cancelar el cambio</button>
    </form>
  </div>
</div>
{% endblock %}
